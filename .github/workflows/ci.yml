name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: composer update --working-dir=tools/ecs --no-interaction --no-progress

            -   name: Check the coding style
                run: composer cs-check

    tests:
        name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ' --prefer-lowest' || '' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]
                dependencies: [ highest ]
                include:
                    -   php: 8.3
                        dependencies: lowest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, pdo_sqlite, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install the dependencies
                run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

            -   name: Run the unit tests
                run: composer unit-tests
